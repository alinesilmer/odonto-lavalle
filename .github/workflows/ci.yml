name: CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is dropped: the backend targets node20 and the root
        # package.json declares engines.node >= 20.
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build backend
        run: |
          npm run typecheck --workspace=backend
          npm run build --workspace=backend

      # Non-blocking: the repo carries ~45 pre-existing no-explicit-any errors that
      # predate the monorepo split. Lint was never enforced in CI before, so this
      # reports the debt without failing the build. Drop continue-on-error once
      # those are cleaned up.
      - name: Lint frontend
        run: npm run lint --workspace=frontend
        continue-on-error: true

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Run tests
        run: npm run test:ci --workspace=frontend
